<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E8E8E5">
  <meta name="description" content="OFFCUT STUDIO 匯款訂單資訊。">
  <title>匯款 — OFFCUT STUDIO</title>
  <link rel="icon" type="image/png" href="./favicon.png.png">
  <link rel="apple-touch-icon" href="./favicon.png.png">
  <link rel="stylesheet" href="style.css?v=offcut-order-flow-2">
  <script src="order-storage.js?v=offcut-cloudflare-orders-1" defer></script>
  <script src="order-model.js?v=offcut-cloudflare-orders-1" defer></script>
  <script src="site-config.js?v=offcut-orders-backend-1" defer></script>
  <script src="order-api.js?v=offcut-orders-backend-1" defer></script>
  <script src="order-summary.js?v=offcut-cloudflare-orders-1" defer></script>
</head>
<body class="payment-page">
  <header class="topbar" aria-label="網站標題"><a class="wordmark" href="index.html" aria-label="OFFCUT STUDIO 首頁"><img src="OFFCUTSTUDIO-transparent.png" alt="OFFCUT STUDIO"></a><span class="edition">VIDEO EDITING&nbsp; / &nbsp;2017</span></header>
  <main class="payment-main" data-payment-page data-method="bank">
    <a class="payment-back" data-payment-back href="checkout.html">← 更換付款方式</a>
    <header class="payment-intro"><p class="checkout-eyebrow">PAYMENT</p><h1>BANK TRANSFER</h1></header>
    <div class="payment-order-id"><span>ORDER ID</span><strong data-payment-order-id>—</strong><button type="button" class="copy-quiet" data-copy-order>複製</button><small data-copy-order-feedback aria-live="polite"></small></div>
    <div class="payment-paygrid payment-paygrid--bank">
      <section class="payment-left">
        <section class="payment-summary" aria-labelledby="payment-order-heading">
          <h2 id="payment-order-heading">ORDER SUMMARY</h2>
          <dl><div><dt>服務</dt><dd data-payment-service>—</dd></div><div><dt>方案版本</dt><dd data-payment-tier>—</dd></div></dl>
        </section>
        <section class="payment-amount"><div><span>應付金額</span><strong data-payment-price>—</strong></div><button type="button" class="copy-quiet" data-copy-amount>複製金額</button><small data-copy-amount-feedback aria-live="polite"></small></section>
        <p class="payment-quote-note" data-quote-note hidden>此方案為起價方案，實際價格需依需求確認。</p>
      </section>
      <section class="payment-information payment-bank-info" aria-labelledby="payment-information-heading">
        <h2 id="payment-information-heading">BANK TRANSFER</h2>
        <dl class="bank-details">
          <div><dt>銀行</dt><dd>永豐銀行</dd></div>
          <div><dt>銀行代號</dt><dd>807</dd></div>
          <div><dt>戶名</dt><dd>網癮中年企業社李文傑</dd></div>
          <div class="bank-account"><dt>帳號</dt><dd>19201800126419</dd><button type="button" class="copy-quiet" data-copy-account>複製帳號</button><small data-copy-account-feedback aria-live="polite"></small></div>
          <div><dt>統一編號</dt><dd>92595823</dd></div>
        </dl>
        <p>請依上方資訊完成轉帳。完成後請保留付款紀錄，並回報付款資訊。</p>
      </section>
    </div>
    <p class="payment-local-note" data-order-local-note>訂單會保存在 OFFCUT 訂單服務。</p>
    <a class="payment-report-resume" data-resume-report hidden>繼續付款回報 →</a>
    <button class="checkout-continue payment-done" type="button" data-payment-done disabled>我已完成付款 <span aria-hidden="true">→</span></button>
    <p class="payment-status-note" data-payment-status-note aria-live="polite"></p>
  </main>
</body>
</html>
