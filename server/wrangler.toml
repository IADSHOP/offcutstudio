name = "offcut-studio-orders"
main = "worker.mjs"
compatibility_date = "2026-10-08"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://iadshop.github.io,http://127.0.0.1:4173,http://localhost:4173"
